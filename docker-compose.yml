version: "3.9"

services:
  coturn:
    image: coturn/coturn:4.6
    container_name: tojam-coturn
    command:
      - -n
      - --log-file=stdout
      - --fingerprint
      - --lt-cred-mech
      - --realm=${COTURN_REALM:-tojam-2021}
      - --user=${COTURN_USER:-tojam-2021}:${COTURN_PASSWORD:-tojam-2021}
      - --listening-port=${COTURN_PORT:-3478}
      - --listening-ip=0.0.0.0
      - --min-port=${COTURN_MIN_PORT:-49152}
      - --max-port=${COTURN_MAX_PORT:-49200}
    ports:
      - "${COTURN_PORT:-3478}:3478/udp"
      - "${COTURN_PORT:-3478}:3478/tcp"
      - "${COTURN_MIN_PORT:-49152}-${COTURN_MAX_PORT:-49200}:${COTURN_MIN_PORT:-49152}-${COTURN_MAX_PORT:-49200}/udp"

  signalling-server:
    build:
      context: ./signalling-server
    container_name: tojam-signalling-server
    depends_on:
      - coturn
    environment:
      HOST: "0.0.0.0"
      PORT: 5050
    ports:
      - "${SIGNALING_SERVER_PORT:-5050}:5050"
